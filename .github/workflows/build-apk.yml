name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VERSION_OUTPUT"

          VERSION_STRING="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | head -n 1 | sed -nE 's/.*version "([^"]+)".*/\1/p')"
          if [[ -z "$VERSION_STRING" ]]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          if [[ "$VERSION_STRING" == 1.* ]]; then
            JAVA_MAJOR="$(printf '%s' "$VERSION_STRING" | cut -d'.' -f2)"
          else
            JAVA_MAJOR="$(printf '%s' "$VERSION_STRING" | cut -d'.' -f1 | sed -E 's/[^0-9].*//')"
          fi

          if [[ ! "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to parse the active Java major version from '${VERSION_STRING}'."
            exit 1
          fi

          echo "Detected Java major version: ${JAVA_MAJOR}"
          if (( JAVA_MAJOR < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java ${JAVA_MAJOR}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="./debug.keystore"
          if [[ -f "$KEYSTORE_PATH" ]]; then
            echo "Existing ./debug.keystore found; skipping temporary keystore generation."
          else
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [[ ! -x "$KEYTOOL_BIN" ]]; then
              echo "::error::keytool was not found in the configured Java 17 installation (${KEYTOOL_BIN})."
              exit 1
            fi

            if ! "$KEYTOOL_BIN" -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt >/dev/null 2>&1; then
              echo "::error::Failed to create temporary debug keystore at ${KEYSTORE_PATH}."
              exit 1
            fi
          fi

          if [[ ! -f "$KEYSTORE_PATH" || ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Temporary debug keystore is missing or empty at ${KEYSTORE_PATH}."
            exit 1
          fi
          echo "Temporary debug keystore verified at ${KEYSTORE_PATH}."

      - name: Prepare Firebase google-services.json
        id: prepare_firebase_config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          CONFIG_PATH="app/google-services.json"

          if [[ -f "$CONFIG_PATH" && -s "$CONFIG_PATH" ]] && ! grep -q "remixed-project-id" "$CONFIG_PATH"; then
            echo "Found valid app/google-services.json in repository."
            echo "created_from_secret=false" >> "$GITHUB_OUTPUT"
          elif [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            TRIMMED_START="$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n\t ' | cut -c1)"
            if [[ "$TRIMMED_START" == "{" ]]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > "$CONFIG_PATH"
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > "$CONFIG_PATH"
            fi

            if ! python3 -c "import json; d=json.load(open('${CONFIG_PATH}')); assert 'project_info' in d and 'client' in d" 2>/dev/null; then
              rm -f "$CONFIG_PATH"
              echo "::error::GOOGLE_SERVICES_JSON secret is not valid Firebase google-services.json (raw JSON or base64-encoded JSON)."
              exit 1
            fi

            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON repository secret."
            echo "created_from_secret=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Missing app/google-services.json! Without it, the built APK fails with 'Default FirebaseApp is not initialized'. Add the contents of app/google-services.json as a GitHub Repository Secret named GOOGLE_SERVICES_JSON (Settings -> Secrets and variables -> Actions -> New repository secret) and re-run this workflow."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Clean up temporary Firebase config
        if: ${{ always() && steps.prepare_firebase_config.outputs.created_from_secret == 'true' }}
        shell: bash
        run: rm -f app/google-services.json

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -e "$EXPECTED_APK" ]]; then
            echo "::error::Expected debug APK does not exist at ${EXPECTED_APK}."
            if [[ -d "app/build/outputs/apk" ]]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              FOUND_APKS="$(find app/build/outputs/apk -type f -name '*.apk' | sort || true)"
              if [[ -n "$FOUND_APKS" ]]; then
                printf '%s\n' "$FOUND_APKS"
              else
                echo "(none)"
              fi
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "$EXPECTED_APK" || -L "$EXPECTED_APK" ]]; then
            echo "::error::${EXPECTED_APK} is not a regular file."
            exit 1
          fi

          if [[ ! -s "$EXPECTED_APK" ]]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          APK_SIZE="$(wc -c < "$EXPECTED_APK" | tr -d '[:space:]')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        id: upload_apk_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$SOURCE_APK" || -L "$SOURCE_APK" || ! -s "$SOURCE_APK" || "$SOURCE_APK" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid at ${SOURCE_APK}."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "$REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[-.]+//; s/[-.]+$//')"
          if [[ -z "$SAFE_REPO_NAME" ]]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_DIR="$(mktemp -d "${RUNNER_TEMP}/release-asset-XXXXXX")"
          ASSET_NAME="voxcraft-ai-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp -- "$SOURCE_APK" "$ASSET_PATH"

          if [[ ! -f "$ASSET_PATH" || -L "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset is missing or invalid at ${ASSET_PATH}."
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset filename: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner. Skipping GitHub Release creation."
            exit 1
          fi
          gh --version

          if [[ -z "${ASSET_PATH:-}" || ! -f "$ASSET_PATH" || -L "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared APK release asset failed validation. Skipping GitHub Release creation."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="VoxCraft AI - Debug APK Build #${GITHUB_RUN_NUMBER}"

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          RELEASE_NOTES="$(cat <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **GitHub Actions Run Number:** ${GITHUB_RUN_NUMBER}
          - **GitHub Actions Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}

          **Important:**
          - This APK is intended for testing only.
          - This APK is not a Play Store production release.
          - This APK is signed only with a temporary debug keystore.
          EOF
          )"

          if ! gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest; then
            echo "::warning::GitHub Release creation failed for tag ${RELEASE_TAG}. The APK build and Actions artifact (app-debug-apk) remain available."
            exit 1
          fi

      - name: Report APK download result
        if: ${{ always() && steps.upload_apk_artifact.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.publish_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.publish_release.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          EFFECTIVE_TAG="${RELEASE_TAG:-debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}}"
          EFFECTIVE_TITLE="${RELEASE_TITLE:-VoxCraft AI - Debug APK Build #${GITHUB_RUN_NUMBER}}"
          EFFECTIVE_ASSET="${ASSET_NAME:-}"

          PUBLISH_VERIFIED="false"
          RELEASE_URL=""

          if [[ "${PUBLISH_OUTCOME:-}" == "success" ]]; then
            if RELEASE_URL="$(gh release view "$EFFECTIVE_TAG" --json url --jq '.url' 2>/dev/null)" && \
               VERIFIED_ASSET="$(gh release view "$EFFECTIVE_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fx -- "$EFFECTIVE_ASSET" | head -n 1 || true)" && \
               [[ -n "$RELEASE_URL" && -n "$VERIFIED_ASSET" ]]; then
              PUBLISH_VERIFIED="true"
            else
              echo "::warning::Unable to verify published release ${EFFECTIVE_TAG} via 'gh release view'."
            fi
          fi

          if [[ "$PUBLISH_VERIFIED" == "true" ]]; then
            echo "Release Tag: ${EFFECTIVE_TAG}"
            echo "Release Title: ${EFFECTIVE_TITLE}"
            echo "Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${EFFECTIVE_ASSET}"
            echo "Download the APK directly from the GitHub Release Assets section."
            echo "The standard GitHub Actions artifact 'app-debug-apk' is also available as a backup."

            {
              echo "## Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Tag:** \`${EFFECTIVE_TAG}\`"
              echo "- **Release Title:** ${EFFECTIVE_TITLE}"
              echo "- **Release Page URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${EFFECTIVE_ASSET}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available in this workflow run as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed. The debug APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available."
            echo "APK Build Status: Succeeded"
            echo "Backup Actions Artifact: app-debug-apk"

            {
              echo "## Debug APK Build Succeeded (GitHub Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the APK to GitHub Releases failed. No release URL is available."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\`"
              echo ""
              echo "Download the debug APK from the \`app-debug-apk\` artifact in this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
